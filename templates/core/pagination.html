{% if page.paginator.num_pages > 1 %}<div class="pagination">{% if page.has_previous %}<a class="button" href="?{% page_query page.previous_page_number %}">Sebelumnya</a>{% endif %}<span>Halaman {{ page.number }} dari {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="button" href="?{% page_query page.next_page_number %}">Berikutnya</a>{% endif %}</div>{% endif %}
