<div class="table-wrap"><table class="compact-table"><colgroup><col style="width:17%"><col style="width:12%"><col style="width:26%"><col style="width:23%"><col style="width:17%"><col style="width:5%"></colgroup><thead><tr><th>Pengadaan</th><th>Pengiriman</th><th>Dapur</th><th>Koperasi</th><th>Status</th><th class="actions-cell">Aksi</th></tr></thead><tbody>{% for order in orders %}<tr><td><a class="strong-link cell-text" href="{% url 'order_detail' order.pk %}">{{ order.code }}</a></td><td class="nowrap">{{ order.delivery_date|date:'d/m/Y' }}</td><td><span class="cell-text" title="{{ order.kitchen.name }}">{{ order.kitchen.name }}</span></td><td><span class="cell-text" title="{{ order.cooperative.name }}">{{ order.cooperative.name }}</span></td><td><span class="badge {{ order.status }}">{{ order.get_status_display }}</span></td><td class="actions-cell"><button class="button icon-button" type="button" aria-haspopup="dialog" aria-controls="row-action-dialog" data-row-dialog="order-actions-{{ order.pk }}" data-dialog-title="{{ order.code }}" aria-label="Aksi {{ order.code }}">{% icon 'more' %}</button><template id="order-actions-{{ order.pk }}"><div class="record-summary"><strong>{{ order.kitchen.name }}</strong><p>{{ order.cooperative.name }} · {{ order.delivery_date|date:'d M Y' }}</p><span class="badge {{ order.status }}">{{ order.get_status_display }}</span></div><div class="dialog-actions"><a class="button" href="{% url 'order_detail' order.pk %}">{% icon 'eye' %} Buka pengadaan</a>{% if is_owner and order.status == 'draft' %}<a class="button" href="{% url 'order_edit' order.pk %}">Ubah tujuan / tanggal</a>{% endif %}</div>{% if is_owner and order.status != 'cancelled' %}<div class="danger-zone"><a class="button danger" href="{% url 'cancel_transaction' 'order' order.pk %}">Batalkan pengadaan</a></div>{% endif %}</template></td></tr>{% empty %}<tr><td colspan="6" class="empty">Tidak ada pengadaan pada bulan atau status ini.</td></tr>{% endfor %}</tbody></table></div>
